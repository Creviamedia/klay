name: Production Zero-Downtime Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy-production:
    name: Build & Deploy Production Static Bundle
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Full Production Build & SSG
        run: npm run build

      - name: Prepare Delivery Archive
        run: |
          cd dist
          zip -r ../klay-dist.zip .
          cd ..

      - name: Deploy to Hostinger with verified FTPS
        env:
          HOSTINGER_SFTP_HOST: ${{ secrets.HOSTINGER_SFTP_HOST }}
          HOSTINGER_SFTP_USER: ${{ secrets.HOSTINGER_SFTP_USER }}
          HOSTINGER_SFTP_PASSWORD: ${{ secrets.HOSTINGER_SFTP_PASSWORD }}
          # Certificate hostname verified against the current Hostinger endpoint (2026-11-17).
          HOSTINGER_FTP_TLS_SERVERNAME: ${{ vars.HOSTINGER_FTP_TLS_SERVERNAME || 'hstgr.io' }}
        run: |
          node --test scripts/test-deploy-ftp.mjs
          node scripts/deploy-ftp.mjs --check
          node scripts/deploy-ftp.mjs
