name: CI Quality Gate & Automated Validation

on:
  push:
    branches: [main, staging, uat, work]
  pull_request:
    branches: [main, staging, uat]

jobs:
  validate:
    name: Typecheck, Build & Validate SEO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Static Typecheck
        run: npm run typecheck

      - name: Security Gate Regression Tests
        run: node scripts/test-security-gates.mjs

      - name: Production Build & SSG Prerendering
        run: npm run build

      - name: Verify Prerender Output Artifacts
        run: |
          test -f dist/index.html || exit 1
          test -f dist/404.html || exit 1
          test -f dist/sitemap.xml || exit 1
          test -f dist/.htaccess || exit 1
          echo "All production artifacts verified."
